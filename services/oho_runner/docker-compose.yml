services:
  oho-runner:
    build: .
    image: oho-runner:local
    container_name: oho-runner
    restart: always
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - OHO_RUNNER_TIMEOUT=180
      - OHO_RUNNER_WORKDIR=/opt/oho
    volumes:
      - /opt/oho:/opt/oho:ro
    networks:
      - n8n_default
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  n8n_default:
    external: true
