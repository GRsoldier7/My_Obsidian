name: audit

# This workflow runs the offline audit suite + unit tests. It does NOT consume
# any github.event.* user-controlled fields in `run:` commands. Inputs from
# user-controlled events (PR title/body, commit messages, head_ref) are
# explicitly NOT used — see GitHub Actions injection guide:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  pull_request:
    branches: [master, polish/prod-ready]
  push:
    branches: [master, polish/prod-ready]

permissions:
  contents: read

jobs:
  offline-audits:
    name: Offline audits + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      # `make audit-ci` is the single CI entry point. It wraps every offline
      # audit + evals schema check + unit tests. Local devs run `make verify`
      # which calls the same target. One source of truth so CI cannot drift
      # from the local pre-PR gate.
      - name: Audit suite + unit tests (single entry)
        run: make audit-ci
